# SLR Platform quality gate.
#
# Execution contract: every job runs on the dedicated self-hosted runner
# `ai-node-slr-platform` on AI-node (192.168.100.29). GitHub-hosted runners are
# forbidden. The label contract is enforced by `scripts/ci/check_runner_policy.sh`
# in the `ci-policy` job before any test job is allowed to start.
#
# The runner is repo-scoped to jaroslawoleradzki-ctrl/slr-platform, has its own
# installation directory/work folder and uses no FINNARO credentials or secrets.
# See docs/runbooks/CI_SELF_HOSTED_RUNNER.md.
name: ci

on:
  pull_request:
  push:
    branches: [main, development, "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  ci-policy:
    name: CI runner policy
    runs-on: [self-hosted, linux, slr-platform]
    # Self-hosted runners must never execute untrusted fork code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject GitHub-hosted runners and enforce AI-node labels
        run: bash scripts/ci/check_runner_policy.sh
      - name: Diff hygiene
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Prove execution on AI-node
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "host=$(hostname)"
          echo "addresses=$(hostname -I)"
          test "${RUNNER_NAME}" = "ai-node-slr-platform"
          test "$(hostname)" = "ai-node"

  openspec:
    name: OpenSpec (pinned CLI)
    runs-on: [self-hosted, linux, slr-platform]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [ci-policy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
      - name: Install pinned OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.15.0
      - name: Assert CLI version
        run: test "$(openspec --version)" = "1.15.0"
      - name: Validate changes and specs
        run: openspec validate --all --strict
      - name: Validate archived changes
        run: openspec validate --archived --strict

  backend:
    name: Backend (Python 3.12)
    runs-on: [self-hosted, linux, slr-platform]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [ci-policy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare isolated CI directory
        run: |
          set -euo pipefail
          # Keep every derived artifact outside the checkout and outside any
          # FINNARO directory. runner.temp is created and cleaned per job.
          SCRATCH="$RUNNER_TEMP/slr-ci-$GITHUB_RUN_ID-backend"
          mkdir -p "$SCRATCH"
          {
            echo "SCRATCH=$SCRATCH"
            echo "UV_PROJECT_ENVIRONMENT=$SCRATCH/venv"
            echo "UV_CACHE_DIR=$SCRATCH/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=$SCRATCH/uv-python"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: false
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python "${{ env.PYTHON_VERSION }}"
      - name: Lint
        run: uv run --frozen --no-sync ruff check app tests scripts
      - name: Type check
        run: uv run --frozen --no-sync mypy app
      - name: Install pinned OpenCode CLI (job-local)
        run: |
          set -euo pipefail
          VERSION=2.2.0
          DEST="$RUNNER_TEMP/opencode-cli"
          HOME_DIR="$RUNNER_TEMP/opencode-home"
          mkdir -p "$DEST" "$HOME_DIR"
          case "$(uname -m)" in
            x86_64) ASSET=opencode-linux-x64.tar.gz ;;
            aarch64|arm64) ASSET=opencode-linux-arm64.tar.gz ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          BASE="https://github.com/anomalyco/opencode/releases/download/v${VERSION}"
          curl -fsSL -o "$DEST/$ASSET" "$BASE/$ASSET"
          curl -fsSL -o "$DEST/SHA256SUMS" "$BASE/SHA256SUMS"
          (cd "$DEST" && grep " $ASSET\$" SHA256SUMS | sha256sum -c -)
          tar -xzf "$DEST/$ASSET" -C "$DEST"
          test -x "$DEST/opencode"
          "$DEST/opencode" --version | grep -qx "opencode v${VERSION}"
          {
            echo "OPENCODE_BIN=$DEST/opencode"
            echo "REQUIRE_OPENCODE_CLI=1"
          } >> "$GITHUB_ENV"
      - name: Security permission tests (mandatory)
        env:
          HOME: ${{ runner.temp }}/opencode-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/opencode-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/opencode-home/.local/share
          XDG_CACHE_HOME: ${{ runner.temp }}/opencode-home/.cache
          XDG_STATE_HOME: ${{ runner.temp }}/opencode-home/.local/state
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          uv run --frozen --no-sync pytest -q -p no:cacheprovider -rs \
            tests/unit/test_agent_foundation_configuration.py \
            tests/unit/test_agent_git_inspection_wrapper.py
      - name: Fetch comparison branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'development' }}"
      - name: Migration safety
        run: |
          uv run --frozen --no-sync python scripts/ci/check_migration_safety.py \
            --base-ref "origin/${{ github.base_ref || 'development' }}"
      - name: Tests (disposable SQLite database)
        env:
          HOME: ${{ runner.temp }}/opencode-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/opencode-home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/opencode-home/.local/share
          XDG_CACHE_HOME: ${{ runner.temp }}/opencode-home/.cache
          XDG_STATE_HOME: ${{ runner.temp }}/opencode-home/.local/state
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          # This suite is SQLite-heavy. Keep test files on tmpfs when available:
          # the same suite takes ~13 min on ext4 due to fsync overhead versus
          # ~1.5 min on tmpfs. The directory is unique per run and disposable.
          TMP_ROOT=/dev/shm
          if [ ! -d "$TMP_ROOT" ] || [ ! -w "$TMP_ROOT" ]; then
            echo "::warning::/dev/shm unavailable; falling back to runner temp"
            TMP_ROOT="$RUNNER_TEMP"
          fi
          TEST_ROOT="$TMP_ROOT/slr-platform-ci-$GITHUB_RUN_ID-$GITHUB_JOB"
          echo "TEST_ROOT=$TEST_ROOT" >> "$GITHUB_ENV"
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"
          export TMPDIR="$TEST_ROOT"
          export SLR_DATABASE_PATH="$TEST_ROOT/slr-platform-ci.db"
          uv run --frozen --no-sync pytest -q -p no:cacheprovider
          # The repository's working database must never be touched by CI.
          if [ -d data ] && find data -maxdepth 1 -name '*.db' -print -quit | grep -q .; then
            echo "::error::CI created a database under data/; tests are not isolated"
            find data -maxdepth 1 -name '*.db' -print
            exit 1
          fi
      - name: Remove isolated test directory
        if: always()
        run: |
          if [ -n "${TEST_ROOT:-}" ]; then
            rm -rf "$TEST_ROOT"
          fi

  frontend:
    name: Frontend (Node 22)
    runs-on: [self-hosted, linux, slr-platform]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [ci-policy]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated npm cache
        run: |
          set -euo pipefail
          CACHE="$RUNNER_TEMP/slr-ci-$GITHUB_RUN_ID-frontend/npm-cache"
          mkdir -p "$CACHE"
          echo "npm_config_cache=$CACHE" >> "$GITHUB_ENV"
      # Deliberately no `cache:` input: this runner is dedicated to SLR Platform
      # and must not inherit caches from other workloads on AI-node.
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

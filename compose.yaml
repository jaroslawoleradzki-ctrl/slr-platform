services:
  slr-platform:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: slr-platform
    ports:
      - "8000:8000"
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
    environment:
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
    restart: unless-stopped

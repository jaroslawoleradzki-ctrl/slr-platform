[project]
name = "slr-platform"
version = "0.6.6"
description = "Modułowa aplikacja wspomagająca systematyczne przeglądy literatury."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pyyaml>=6.0,<7.0",
  "httpx>=0.28,<1.0",
  "tenacity>=9.1,<10.0",
  "python-multipart>=0.0.20,<1.0",
  "openpyxl>=3.1,<4.0",
  "fpdf2>=2.8,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "ruff>=0.12,<1.0", "mypy>=1.16,<2.0", "types-pyyaml>=6.0", "pypdf>=6.16,<7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pypdf>=6.16.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["docker*", "projects*", "tests*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W291"]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fpdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true
